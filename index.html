<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NUTRI-X : 식단 구출작전</title>
<style>
/* ============================================================
   NUTRI-X : 식단 구출작전  —  단일 파일 교육용 방탈출 게임
   ============================================================ */

:root{
  --bg0:#eaf6ff; --bg1:#fef0f3; --bg2:#eafff4;
  --ink:#10243b; --ink2:#3f5a78; --muted:#8aa1bd;
  --card:#ffffff; --line:#dbe7f4;
  --mint:#13d8a8; --mint-d:#0bb38b;
  --coral:#ff6b6b; --coral-d:#f24b5e;
  --sun:#ffce3a; --sun-d:#f5b400;
  --sky:#3aa8ff; --sky-d:#1f7ee0;
  --grape:#9b6bff; --grape-d:#7c46e0;
  --orange:#ff9f43;
  --carb:#ffce3a; --protein:#ff6b6b; --fat:#ff9f43;
  --vit:#28c76f; --min:#9b6bff; --water:#3aa8ff;
  --ok:#28c76f; --warn:#ffb020; --bad:#ff5b6e;
  --shadow:0 18px 40px -18px rgba(24,60,110,.45);
  --radius:22px;
  --font:'Pretendard','Pretendard Variable','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font); color:var(--ink);
  background:
    radial-gradient(1200px 700px at 12% -10%, #d6f3ff 0%, transparent 55%),
    radial-gradient(1000px 700px at 105% 5%, #ffe1ea 0%, transparent 55%),
    radial-gradient(1100px 800px at 50% 115%, #d8ffe9 0%, transparent 55%),
    linear-gradient(160deg,var(--bg0),var(--bg1) 55%,var(--bg2));
  background-attachment:fixed;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
body::before{ /* subtle tech grid */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(58,168,255,.06) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(58,168,255,.06) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(circle at 50% 40%,#000 40%,transparent 85%);
}

#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:14px 16px 60px;}

/* ---------- TYPOGRAPHY ---------- */
h1,h2,h3{margin:0;line-height:1.18;letter-spacing:-.02em;}
.eyebrow{font-weight:800;font-size:.78rem;letter-spacing:.22em;color:var(--mint-d);text-transform:uppercase;}
.title-xl{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:900;letter-spacing:-.03em;}
.lead{color:var(--ink2);font-size:1.02rem;line-height:1.65;}
.mono{font-variant-numeric:tabular-nums;}

/* ---------- BUTTONS ---------- */
.btn{
  appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:800;
  padding:15px 26px;border-radius:16px;font-size:1.02rem;color:#fff;
  background:linear-gradient(135deg,var(--mint),var(--sky));
  box-shadow:0 12px 24px -10px rgba(19,216,168,.7);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  letter-spacing:-.01em;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04);}
.btn:active{transform:translateY(1px) scale(.99);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:grayscale(.3);}
.btn.coral{background:linear-gradient(135deg,var(--coral),var(--orange));box-shadow:0 12px 24px -10px rgba(255,107,107,.7);}
.btn.sun{background:linear-gradient(135deg,var(--sun),var(--orange));color:#5a3d00;box-shadow:0 12px 24px -10px rgba(255,206,58,.7);}
.btn.grape{background:linear-gradient(135deg,var(--grape),var(--sky));box-shadow:0 12px 24px -10px rgba(155,107,255,.6);}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;}
.btn.ghost:hover{border-color:var(--sky);}
.btn.big{padding:18px 34px;font-size:1.15rem;border-radius:18px;}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}

/* ---------- CARD / PANEL ---------- */
.panel{
  background:linear-gradient(180deg,#ffffff,#fbfdff);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px;
}
.glass{
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);
}

/* ---------- SCREEN FADE ---------- */
.screen{animation:fadeUp .45s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes glowpulse{0%,100%{box-shadow:0 0 0 0 rgba(19,216,168,.0)}50%{box-shadow:0 0 30px 4px rgba(19,216,168,.4)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ============ TITLE SCREEN ============ */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:36px 20px 28px;}
.logo-badge{
  width:128px;height:128px;border-radius:34px;display:grid;place-items:center;
  font-size:64px;background:linear-gradient(135deg,#0b1530,#1c3a6e);
  box-shadow:0 20px 50px -12px rgba(20,50,120,.6),inset 0 0 0 3px rgba(255,255,255,.08);
  animation:float 4s ease-in-out infinite;position:relative;
}
.logo-badge::after{content:"";position:absolute;inset:-6px;border-radius:40px;
  background:conic-gradient(from 0deg,var(--mint),var(--sky),var(--grape),var(--coral),var(--sun),var(--mint));
  z-index:-1;filter:blur(14px);opacity:.55;animation:spin 8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{font-size:clamp(2.4rem,8vw,4.4rem);font-weight:900;letter-spacing:-.04em;
  background:linear-gradient(120deg,#0bb38b,#1f7ee0,#7c46e0);-webkit-background-clip:text;background-clip:text;color:transparent;}
.subbrand{font-size:clamp(1.1rem,3.6vw,1.7rem);font-weight:800;color:var(--ink);}
.tag-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-weight:700;font-size:.85rem;color:var(--ink2);box-shadow:0 6px 14px -10px rgba(0,0,0,.3);}

.name-box{display:flex;flex-direction:column;gap:12px;max-width:440px;width:100%;}
.name-box input{
  font-family:inherit;font-size:1.25rem;font-weight:800;text-align:center;
  padding:16px;border-radius:16px;border:2.5px solid var(--line);outline:none;
  color:var(--ink);background:#fff;transition:border-color .15s;
}
.name-box input:focus{border-color:var(--mint);box-shadow:0 0 0 4px rgba(19,216,168,.15);}

/* ============ HUD / STAT BAR ============ */
.hud{position:sticky;top:8px;z-index:30;margin-bottom:16px;}
.hud-inner{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;flex-wrap:wrap;}
.hud-id{display:flex;align-items:center;gap:10px;font-weight:800;}
.hud-id .av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--mint),var(--sky));display:grid;place-items:center;color:#fff;font-size:20px;}
.hud-sys{flex:1;min-width:200px;}
.hud-sys .lbl{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.08em;display:flex;justify-content:space-between;}
.sysbar{height:13px;border-radius:999px;background:#e7eef8;overflow:hidden;margin-top:5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);}
.sysbar>i{display:block;height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg,var(--coral),var(--sun),var(--mint),var(--sky));
  background-size:300% 100%;transition:width .8s cubic-bezier(.2,.8,.2,1);animation:flow 3s linear infinite;}
@keyframes flow{to{background-position:300% 0}}
.hud-score{text-align:right;font-weight:900;}
.hud-score b{font-size:1.5rem;color:var(--mint-d);}
.hud-score span{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.1em;}

/* ============ DIALOGUE / STORY ============ */
.story{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;}
.avatar{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;font-size:52px;flex:none;
  background:linear-gradient(135deg,#eaf6ff,#fff);border:1px solid var(--line);box-shadow:var(--shadow);}
.avatar.ai{background:linear-gradient(135deg,#0b1530,#1c3a6e);color:#9fe;animation:glowpulse 2.6s ease-in-out infinite;}
.bubble{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);position:relative;}
.bubble .who{font-weight:900;font-size:.95rem;color:var(--sky-d);margin-bottom:6px;}
.bubble p{margin:0 0 8px;line-height:1.65;color:var(--ink);font-size:1.04rem;}
.bubble p:last-child{margin-bottom:0;}
.hl{background:linear-gradient(transparent 55%,#fff0a8 55%);font-weight:800;padding:0 2px;border-radius:4px;}

/* ============ NUTRIENT CARDS ============ */
.grid{display:grid;gap:14px;}
.nutri-card{border-radius:18px;padding:16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 14px 26px -14px rgba(0,0,0,.45);cursor:grab;user-select:none;}
.nutri-card .emoji{font-size:34px;}
.nutri-card h3{font-size:1.2rem;margin-top:4px;}
.nutri-card small{opacity:.92;font-weight:600;}
.nutri-card.c-carb{background:linear-gradient(135deg,#ffd54a,#f5a623);color:#5a3d00;}
.nutri-card.c-protein{background:linear-gradient(135deg,#ff7a7a,#f24b5e);}
.nutri-card.c-fat{background:linear-gradient(135deg,#ffb066,#ff8a3d);color:#5a2f00;}
.nutri-card.c-vit{background:linear-gradient(135deg,#39d97a,#16a85a);}
.nutri-card.c-min{background:linear-gradient(135deg,#a987ff,#7c46e0);}
.nutri-card.c-water{background:linear-gradient(135deg,#5cc0ff,#1f7ee0);}
.nutri-card.dragging{opacity:.4;}

/* matching slots */
.slot{border:2.5px dashed var(--line);border-radius:18px;padding:16px;min-height:92px;background:#fff;display:flex;gap:12px;align-items:center;transition:all .15s;}
.slot.over{border-color:var(--mint);background:#effff8;transform:scale(1.01);}
.slot.filled{border-style:solid;}
.slot .desc{flex:1;}
.slot .desc b{display:block;font-weight:900;color:var(--ink);}
.slot .desc small{color:var(--ink2);line-height:1.45;display:block;margin-top:3px;}
.slot .drop{width:120px;flex:none;}
.mini-chip{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:10px 12px;color:#fff;font-weight:900;font-size:.92rem;width:100%;justify-content:center;}

/* ch1: 영양소 카드 3×2 그리드 + 설명 2열 */
.nutri-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.nutri-grid .nutri-card{display:flex;align-items:center;gap:10px;padding:14px 16px;width:auto;}
.nutri-grid .nutri-card .emoji{font-size:30px;}
.nutri-grid .nutri-card h3{font-size:1.1rem;margin:0;}
.nutri-card.placed{cursor:default;opacity:.5;filter:grayscale(.25);}
.nutri-card.placed .done-tag{margin-left:auto;font-size:.7rem;font-weight:800;background:rgba(255,255,255,.4);padding:3px 9px;border-radius:999px;}
.match-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(max-width:860px){.match-grid{grid-template-columns:1fr;}}
@media(max-width:560px){.nutri-grid .nutri-card{padding:12px;gap:7px;} .nutri-grid .nutri-card h3{font-size:.95rem;} .nutri-grid .nutri-card .emoji{font-size:26px;}}

/* function buckets */
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.bucket{border-radius:20px;padding:16px;min-height:170px;border:2.5px dashed var(--line);background:#fff;transition:all .15s;}
.bucket.over{border-color:var(--mint);background:#effff8;}
.bucket h3{font-size:1.05rem;display:flex;align-items:center;gap:8px;}
.bucket .icon{font-size:26px;}
.bucket .hint{font-size:.8rem;color:var(--muted);margin:6px 0 10px;line-height:1.4;}
.bucket .drops{display:flex;flex-wrap:wrap;gap:8px;}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}

/* ============ FOOD CARDS (DIET DESIGNER) ============ */
.designer{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start;}
.meal-tabs{display:flex;gap:8px;margin-bottom:12px;}
.meal-tab{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 8px;font-weight:900;cursor:pointer;color:var(--ink2);transition:.15s;font-size:1rem;}
.meal-tab.active{color:#fff;border-color:transparent;}
.meal-tab[data-m="breakfast"].active{background:linear-gradient(135deg,var(--sun),var(--orange));color:#5a3d00;}
.meal-tab[data-m="lunch"].active{background:linear-gradient(135deg,var(--mint),var(--sky));}
.meal-tab[data-m="dinner"].active{background:linear-gradient(135deg,var(--grape),var(--sky));}
.meal-plate{border:2.5px dashed var(--line);border-radius:18px;min-height:130px;padding:12px;background:#fbfdff;transition:.15s;}
.meal-plate.over{border-color:var(--mint);background:#effff8;}
.meal-plate .empty{color:var(--muted);text-align:center;padding:24px 6px;font-weight:600;}
.chosen{display:flex;flex-wrap:wrap;gap:8px;}
.food-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;font-weight:800;font-size:.92rem;cursor:pointer;box-shadow:0 4px 10px -8px rgba(0,0,0,.4);animation:pop .25s ease;}
.food-chip:hover{border-color:var(--coral);color:var(--coral-d);}
.food-chip .x{color:var(--coral);font-weight:900;}

.pantry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;}
.fbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-weight:800;font-size:.8rem;cursor:pointer;color:var(--ink2);}
.fbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.pantry{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px;max-height:430px;overflow:auto;padding:4px;}
.food{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px 8px;text-align:center;cursor:pointer;user-select:none;transition:.12s;position:relative;}
.food:hover{transform:translateY(-3px);border-color:var(--mint);box-shadow:0 12px 18px -12px rgba(0,0,0,.4);}
.food:active{transform:scale(.96);}
.food .e{font-size:30px;line-height:1;}
.food .n{font-weight:800;font-size:.82rem;margin-top:5px;}
.food .g{font-size:.62rem;font-weight:800;margin-top:3px;border-radius:6px;padding:1px 4px;display:inline-block;}
.food.dragging{opacity:.4;}

/* gauges */
.gauges{display:grid;gap:10px;}
.gauge .top{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;margin-bottom:4px;}
.gauge .top .pct{color:var(--muted);font-variant-numeric:tabular-nums;}
.bar{height:14px;border-radius:999px;background:#e9f0f9;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.1);}
.bar>i{display:block;height:100%;border-radius:999px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1);}
.g-carb .bar>i{background:linear-gradient(90deg,#ffd54a,#f5a623);}
.g-protein .bar>i{background:linear-gradient(90deg,#ff7a7a,#f24b5e);}
.g-fat .bar>i{background:linear-gradient(90deg,#ffb066,#ff8a3d);}
.g-vit .bar>i{background:linear-gradient(90deg,#39d97a,#16a85a);}
.g-min .bar>i{background:linear-gradient(90deg,#a987ff,#7c46e0);}
.g-water .bar>i{background:linear-gradient(90deg,#5cc0ff,#1f7ee0);}

/* ============ CITIZEN MISSION ============ */
.mission-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.cit-av{width:80px;height:80px;border-radius:22px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#eaf6ff,#fff);border:1px solid var(--line);flex:none;box-shadow:var(--shadow);}
.problem{background:#fff7f7;border:1px solid #ffd9d9;border-radius:16px;padding:14px 16px;margin-top:12px;}
.problem b{color:var(--coral-d);}
.req{background:#eefcff;border:1px solid #c7eeff;border-radius:16px;padding:14px 16px;margin-top:10px;}
.req b{color:var(--sky-d);}

.progress-dots{display:flex;gap:6px;flex-wrap:wrap;}
.dot{width:11px;height:11px;border-radius:50%;background:#d6e3f2;}
.dot.done{background:var(--mint);}
.dot.now{background:var(--sun);box-shadow:0 0 0 4px rgba(255,206,58,.3);}

/* ============ REPORT MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(12,28,50,.55);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:16px;animation:fadeUp .25s ease;}
.modal{max-width:720px;width:100%;max-height:92vh;overflow:auto;border-radius:26px;background:#fff;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);padding:26px;animation:pop .35s ease;}
.report-score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.ring{--p:0;width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--mint) calc(var(--p)*1%),#e9f0f9 0);transition:--p 1s;}
.ring .inner{width:90px;height:90px;border-radius:50%;background:#fff;display:grid;place-items:center;flex-direction:column;text-align:center;}
.ring b{font-size:2rem;font-weight:900;color:var(--mint-d);line-height:1;}
.ring small{font-size:.66rem;color:var(--muted);font-weight:800;}
.verdict{flex:1;min-width:200px;}
.verdict h3{font-size:1.35rem;}
.func-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
.func{border-radius:16px;padding:12px;text-align:center;color:#fff;}
.func.energy{background:linear-gradient(135deg,#ffce3a,#ff8a3d);color:#5a3d00;}
.func.build{background:linear-gradient(135deg,#ff7a7a,#9b6bff);}
.func.reg{background:linear-gradient(135deg,#39d97a,#3aa8ff);}
.func .v{font-size:1.6rem;font-weight:900;}
.func .l{font-size:.78rem;font-weight:800;opacity:.95;}
.tips{background:#f6faff;border-radius:14px;padding:14px 16px;margin-top:8px;}
.tips li{margin:5px 0;line-height:1.5;}
.stars{font-size:1.6rem;letter-spacing:4px;}

/* ============ ENDING ============ */
.ending{text-align:center;}
.ending .badge{font-size:96px;animation:float 3.5s ease-in-out infinite;}
.ending h1{font-size:clamp(2rem,6vw,3rem);margin:8px 0;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden;}
.confetti i{position:absolute;width:11px;height:16px;top:-20px;opacity:.95;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}

/* progress bar tutorial chip */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.chip{background:#eef6ff;border:1px solid #d3e6fb;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.82rem;color:var(--sky-d);}

.center{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.spacer{height:14px;}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.section-title .n{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--mint),var(--sky));color:#fff;display:grid;place-items:center;font-weight:900;flex:none;}
.note{font-size:.85rem;color:var(--muted);}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:14px;font-weight:800;z-index:200;opacity:0;transition:.3s;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- RESPONSIVE ---------- */
@media(max-width:880px){
  .designer{grid-template-columns:1fr;}
  .buckets{grid-template-columns:1fr;}
  .func-row{grid-template-columns:1fr;}
  .story{grid-template-columns:1fr;}
  .avatar{width:72px;height:72px;font-size:40px;}
  .pantry{max-height:none;}
}
@media(max-width:520px){
  .meal-tab{font-size:.86rem;padding:10px 4px;}
  #app{padding:10px 12px 50px;}
  .panel{padding:18px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   1. DATA
   ============================================================ */

const NUTRIENTS = {

/* ============================================================
   3. SCORING ENGINE  (정답은 하나가 아니다 — 균형으로 채점)
   ============================================================ */
function dietTotals(diet){
  const t={c:0,p:0,f:0,v:0,m:0,w:0};
  ['breakfast','lunch','dinner'].forEach(m=>{
    diet[m].forEach(id=>{
      const f=FOOD_BY_ID[id];
      NKEYS.forEach((k,i)=>t[k]+=f.v[i]);
    });
  });
  return t;
}
// 영양소 충족도 점수 (목표 대비, 80~135%면 만점, 부족/과잉 감점)
function nutrientScore(total,target){
  if(target<=0) return 100;
  const r=total/target;
  if(r>=0.8 && r<=1.35) return 100;
  if(r<0.8) return Math.max(0, Math.round(r/0.8*100));
  // 과잉
  return Math.max(35, Math.round(100 - (r-1.35)*70));
}
function pctOf(total,target){ return Math.round(total/target*100); }

function evalDiet(diet, citizen){
  const t=dietTotals(diet);
  // 6 nutrient scores
  const ns={}; NKEYS.forEach(k=> ns[k]=nutrientScore(t[k],TARGET[k]) );
  // 3 function scores
  const energyVal=t.c + t.f*1.3, energyTar=TARGET.c + TARGET.f*1.3;
  const buildVal=t.p*1.4 + t.m*0.6, buildTar=TARGET.p*1.4 + TARGET.m*0.6;
  const regVal=t.v + t.m*0.4 + t.w*0.6, regTar=TARGET.v + TARGET.m*0.4 + TARGET.w*0.6;
  const fs={
    energy:nutrientScore(energyVal,energyTar),
    build:nutrientScore(buildVal,buildTar),
    reg:nutrientScore(regVal,regTar),
  };
  // variety: 몇 개 식품군 사용?
  const groupsUsed=new Set();
  ['breakfast','lunch','dinner'].forEach(m=>diet[m].forEach(id=>{
    const g=FOOD_BY_ID[id].g; if(g) groupsUsed.add(g);
  }));
  const varietyScore=Math.min(100, Math.round(groupsUsed.size/5*100));
  // meal balance (세 끼니 분산)
  const counts=['breakfast','lunch','dinner'].map(m=>diet[m].length);
  const totalItems=counts.reduce((a,b)=>a+b,0);
  const emptyMeals=counts.filter(c=>c===0).length;
  let spreadScore=100;
  if(totalItems>0){
    const ideal=totalItems/3;
    const dev=counts.reduce((a,c)=>a+Math.abs(c-ideal),0)/totalItems;
    spreadScore=Math.max(0,Math.round(100-dev*120));
  }
  const breakfastScore = diet.breakfast.length>=2?100:diet.breakfast.length===1?60:0;
  // low-fat 보너스(지방 적정)
  const fatRatio=t.f/TARGET.f;
  const lowfatScore = fatRatio<=1.3?100:Math.max(30,Math.round(100-(fatRatio-1.3)*80));

  // 기본 점수: 6영양소 + 3기능 평균
  const baseMetrics=[ns.c,ns.p,ns.f,ns.v,ns.m,ns.w,fs.energy,fs.build,fs.reg];
  let base=baseMetrics.reduce((a,b)=>a+b,0)/baseMetrics.length;

  // citizen focus 가중
  let score=base, applied=0, sumW=0, weighted=0;
  const f=citizen?citizen.focus:{};
  const lookup={c:ns.c,p:ns.p,f:ns.f,v:ns.v,m:ns.m,w:ns.w,
    energy:fs.energy,build:fs.build,reg:fs.reg,
    variety:varietyScore,spread:spreadScore,breakfast:breakfastScore,lowfat:lowfatScore};
  for(const key in f){ const w=f[key]; sumW+=w; weighted+=(lookup[key]||0)*w; applied++; }
  if(applied>0){
    // 60% base + 40% focus 가중
    const focusAvg=weighted/sumW;
    score=base*0.55 + focusAvg*0.45;
  }
  // 변형/분산 소폭 보너스(편식 방지)
  score = score*0.9 + varietyScore*0.1;
  // 빈 끼니 규칙: 한 끼라도 거르면 구조 성공 불가(48점 이하로 제한)
  if(emptyMeals>=1) score=Math.min(score,48);
  if(totalItems<4) score=Math.min(score,55);
  score=Math.max(0,Math.min(100,Math.round(score)));

  return {totals:t, ns, fs, varietyScore, spreadScore, breakfastScore, lowfatScore,
          groupsUsed:[...groupsUsed], score, emptyMeals, totalItems,
          energy:fs.energy, build:fs.build, reg:fs.reg};
}

      <div class="ring" id="ring"><div class="inner"><b id="ringv">0</b><small>균형점수</small></div></div>
      <div class="verdict">
        <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
        <h3>${r.score>=60?'✅ 구조 성공!':'🔁 재도전 추천'}</h3>
        <p class="lead" style="font-size:.96rem;margin-top:4px">${verdictText(r.score,c)}</p>
      </div>
    </div>
    <h3 style="margin:18px 0 8px">📊 영양소 충족도</h3>
    <div class="gauges">
      ${NKEYS.map(k=>{const N=NUTRIENTS[k];const pct=Math.min(100,pctOf(r.totals[k],TARGET[k]));
        return `<div class="gauge ${N.g}"><div class="top"><span>${N.emoji} ${N.name}</span><span class="pct">${pctOf(r.totals[k],TARGET[k])}% (${grade(r.ns[k])})</span></div><div class="bar"><i data-w="${pct}"></i></div></div>`;}).join('')}
    </div>
    <h3 style="margin:18px 0 8px">⚙️ 영양소 기능 점수</h3>
    <div class="func-row">
      <div class="func energy"><div class="v">${r.fs.energy}</div><div class="l">⚡ 활동 에너지</div></div>
      <div class="func build"><div class="v">${r.fs.build}</div><div class="l">🧱 몸 구성</div></div>
      <div class="func reg"><div class="v">${r.fs.reg}</div><div class="l">⚖️ 기능 조절</div></div>
    </div>
    <div class="tips"><b>🤖 NUTRI-X의 한마디</b><ul style="margin:8px 0 0;padding-left:20px">
      ${reportLines(r,c).map(l=>`<li>${l}</li>`).join('')}
    </ul></div>
    <div class="spacer"></div>
    <div class="btn-row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeReport()">↺ 식단 다시 고치기</button>
      ${r.score>=55
        ? `<button class="btn" onclick="acceptMission()">✅ 이 식단으로 ${esc(c.name)}님 구조</button>`
        : `<button class="btn ghost" disabled>점수가 부족해요 (55점 이상 필요)</button>`}
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeReport();});
  requestAnimationFrame(()=>{
    ov.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w+'%');
    const ring=$('#ring'); animRing(ring,$('#ringv'),r.score);
  });
}
function grade(s){return s>=90?'최상':s>=75?'좋음':s>=60?'보통':'부족';}
function animRing(ring,vEl,target){
  let cur=0; const step=()=>{cur+=Math.max(1,Math.round((target-cur)/6));if(cur>=target)cur=target;
    ring.style.setProperty('--p',cur);vEl.textContent=cur;
    ring.style.background=`conic-gradient(${target>=75?'#13d8a8':target>=60?'#ffb020':'#ff5b6e'} ${cur}%,#e9f0f9 0)`;
    if(cur<target)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function closeReport(){ const o=$('#ovl'); if(o)o.remove(); }
function acceptMission(){
  const {r,c}=_lastReport;
  S.missionResults[S.missionIdx]={score:r.score, totals:r.totals};
  closeReport();
  confettiBurst();
  // 시스템 복구율: 70 → 100 across missions
  setSys(70 + 30*((S.missionIdx+1)/CITIZENS.length));
  if(S.missionIdx+1 < CITIZENS.length){
    toast(`✅ ${c.name}님 구조 완료! (+${r.score}점)`);
    setTimeout(()=>openMission(S.missionIdx+1),700);
  } else {
    setSys(100);
    setTimeout(()=>{S.screen='finalIntro';render();},700);
  }
}

/* ---------- ENDING ---------- */
function computeEnding(){
  const all=[...S.missionResults.map(m=>m), {score:S.finalResult.score, totals:S.finalResult.totals}];
  const avg=Math.round(all.reduce((a,b)=>a+b.score,0)/all.length);
  // 패턴 집계
  let lowWater=0,highFat=0,lowVeg=0;
  all.forEach(m=>{
    if(m.totals.w/TARGET.w<0.55) lowWater++;
    if(m.totals.f/TARGET.f>1.45) highFat++;
    if((m.totals.v/TARGET.v<0.55)||(m.totals.m/TARGET.m<0.55)) lowVeg++;
  });
  const n=all.length;
  let key;
  // 특수 엔딩 (평균이 아주 높지 않을 때 우선 적용)
  if(avg<82 && lowWater>=Math.ceil(n*0.5)) key='special_water';
  else if(avg<82 && highFat>=Math.ceil(n*0.45)) key='special_fat';
  else if(avg<82 && lowVeg>=Math.ceil(n*0.5)) key='special_veg';
  else if(avg>=90) key='master';
  else if(avg>=80) key='expert';
  else if(avg>=70) key='elite';
  else if(avg>=60) key='rookie';
  else {
    // 저점수: 탄수 편중 여부로 분기
    const carbHeavy=all.filter(m=>m.totals.c/TARGET.c>1.1 && (m.totals.p/TARGET.p<0.7||m.totals.v/TARGET.v<0.7)).length;
    key= carbHeavy>=Math.ceil(n*0.4)?'carbcity':'warning';
  }
  S.ending={key, avg, all, lowWater, highFat, lowVeg, n};
  S.screen='ending'; render();
  setTimeout(()=>confettiBurst(avg>=70?80:30),200);
}

function restart(){

    missionResults:[],sysPercent:0,finalResult:null,ending:null});

/* ============================================================
   7. CONFETTI
   ============================================================ */
function confettiBurst(count=60){
  const colors=['#13d8a8','#3aa8ff','#9b6bff','#ff6b6b','#ffce3a','#ff9f43'];
  const wrap=document.createElement('div'); wrap.className='confetti';
  document.body.appendChild(wrap);
  for(let i=0;i<count;i++){
    const c=document.createElement('i');
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    c.style.animationDelay=(Math.random()*.4)+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    wrap.appendChild(c);
  }
  setTimeout(()=>wrap.remove(),3200);
}
